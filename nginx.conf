# Minimal reverse proxy / static hosting for goravel-admin (enterprise-hardened sample).
#
# 1) API vhost  - REQUIRED pieces: /ws + /  -> Go :3000
# 2) Admin SPA  - OPTIONAL separate vhost when frontend is on the same server
#
# Typical API: SSL at Cloudflare, origin :80 only.
# Cloudflare: Network -> WebSockets On; SSL/TLS Flexible (or Full if origin has certs).
#
# Build frontend first:
#   cd html-react && npm ci && npm run build   # dist -> html-react/dist (recommended)
#   # or: cd html && npm ci && npm run build  # Vue dist -> html/dist
# Set SPA VITE_API_BASE_URL to your API origin (e.g. https://api.example.com).

upstream goravel_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Shared rate-limit zones (10m memory ~160k keys)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# ---------------------------------------------------------------------------
# API (required) — HTTP origin behind TLS terminator (Cloudflare / LB)
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name api.example.com;

  # Cap uploads; raise only if you accept multi-GB attachments at the edge.
  client_max_body_size 100m;

  # Baseline security headers (app also sets some; edge copy is defense-in-depth)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Enable only when this vhost is HTTPS end-to-end (or Full Strict at CF):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  limit_conn api_conn 40;

  # Do not expose Prometheus scrape publicly without network ACL / METRICS_TOKEN.
  location = /metrics {
    # allow 10.0.0.0/8;
    # deny all;
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://goravel_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Login / OIDC redirect — tighter throttle
  location ~ ^/api/admin/(login|auth/oidc) {
    limit_req zone=api_login burst=10 nodelay;
    proxy_pass http://goravel_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # REQUIRED: WebSocket /ws/admin/notifications
  location /ws {
    proxy_pass http://goravel_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # REQUIRED: reverse proxy everything else to Go
  location / {
    limit_req zone=api_general burst=60 nodelay;
    proxy_pass http://goravel_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
  }

  # OPTIONAL: long-lived SSE (monitor system-info stream). Enable if SSE drops early.
  # location ~ ^/api/admin/monitor/system-info/stream {
  #   proxy_pass http://goravel_api;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_buffering off;
  #   proxy_cache off;
  #   proxy_read_timeout 86400s;
  #   proxy_send_timeout 86400s;
  #   gzip off;
  # }

  # OPTIONAL: serve local-disk attachments. Skip if FILESYSTEM_DISK=s3/r2 only.
  # location /storage/ {
  #   alias /path/to/storage/app/public/;
  #   expires 1h;
  #   add_header Cache-Control "public";
  #   access_log off;
  # }
}

