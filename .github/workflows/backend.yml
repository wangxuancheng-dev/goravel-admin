name: Backend

on:
  push:
    branches:
      - main
      - master
    # Frontend-only and docs-only changes do not need the backend checks.
    paths-ignore:
      - 'html/**'
      - 'html-react/**'
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'html/**'
      - 'html-react/**'
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # orm / nilctx / cache / goctx rules; intended exceptions carry a
      # //tenantlint:allow <rule>: <reason> comment at the call site.
      - name: Tenant guard (tenantlint)
        run: go run ./scripts/tenantlint

      - name: Unit tests (no external services)
        run: |
          set -euo pipefail
          mapfile -t PKGS < <(go list ./... | grep -vE '/tests/feature$|node_modules')
          go test -count=1 -timeout=3m "${PKGS[@]}"

      # packages/payment is a nested module, so `go list ./...` above skips it.
      - name: Payment module (vet + unit tests)
        working-directory: packages/payment
        run: |
          go vet ./...
          go test -count=1 -timeout=3m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .golangci.yml new-from-rev needs the baseline commit in history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck (allowlist in scripts/check-govulncheck.sh)
        run: bash scripts/check-govulncheck.sh

  backend-integration:
    name: Backend Integration (${{ matrix.shard }})
    # Pinned: the postgres service below must match this image's pg_dump / psql.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The feature tests are dominated by tenant tests that create, migrate and seed real
    # databases. Two shards run them side by side: "heavy" runs the slowest ones by name,
    # "rest" runs everything else via -skip, so a new test always lands in some shard.
    # Rebalance HEAVY_TESTS with the per-test CI timings each shard posts as a notice
    # annotation ("Slowest feature tests"); local timings do not carry over to CI.
    # "pg-platform" runs the whole suite with the platform database on PostgreSQL
    # (transactional DDL in migrations, schema-scoped lookups, tenant ownership).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy
            select: -run
            db_connection: mysql
            db_port: '3306'
            db_username: root
            db_password: root
          - shard: rest
            select: -skip
            db_connection: mysql
            db_port: '3306'
            db_username: root
            db_password: root
          - shard: pg-platform
            select: -run
            pattern: '.'
            db_connection: postgres
            db_port: '5432'
            db_username: postgres
            db_password: postgres

    env:
      HEAVY_TESTS: '^(TestBackupFleetFanOut|TestTenantLifecycleAndIsolationOverHTTP|TestDualTenantDatabaseIsolation|TestTenantCreateWithMigrateAndSeed)$'
      # Fleet migrate+seed: 3 tenants on 2 workers still covers parallel runs and queueing.
      TENANCY_TEST_FLEET_COUNT: '3'
      TENANCY_TEST_FLEET_CONCURRENCY: '2'
      # PostgreSQL tenants (TestPostgresTenantLifecycle), on whichever platform database.
      TENANCY_TEST_PG_HOST: 127.0.0.1
      TENANCY_TEST_PG_PORT: '5432'
      TENANCY_TEST_PG_USER: postgres
      TENANCY_TEST_PG_PASSWORD: postgres

    services:
      postgres:
        # Same major version as the runner's pg_dump / psql (ubuntu-24.04 ships 16):
        # pg_dump refuses to dump a newer server.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goravel # the platform database of the pg-platform shard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare env
        run: |
          set -euo pipefail
          # Postgres tenant backup/restore runs these clients; fail early if missing.
          pg_dump --version
          psql --version
          cp .env.example .env
          # Goravel requires APP_KEY to be exactly 32 chars (no base64: prefix).
          # Invalid keys make Config exit 0 before migrate runs — CI would go green falsely.
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=test/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's/^APP_KEY=.*/APP_KEY=ci-test-app-key-32-bytes-long!!!/' \
            -e 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-change-me-not-for-prod/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=${{ matrix.db_connection }}/' \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=${{ matrix.db_port }}/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=goravel/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=${{ matrix.db_username }}/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=${{ matrix.db_password }}/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=redis/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            -e 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' \
            -e 's/^REDIS_PORT=.*/REDIS_PORT=6379/' \
            .env

      - name: Migrate
        run: |
          set -euo pipefail
          go run . artisan migrate 2>&1 | tee migrate.log
          # Config exits 0 on bad APP_KEY; migrate Handle also returns nil on error.
          grep -q 'Migration success' migrate.log

      - name: Feature / smoke tests
        env:
          TEST_PATTERN: ${{ matrix.pattern || env.HEAVY_TESTS }}
        run: |
          set -o pipefail
          go test -count=1 -v -timeout=12m ${{ matrix.select }} "$TEST_PATTERN" ./tests/feature/... 2>&1 | tee feature.log

      - name: Report slowest feature tests
        if: always()
        run: |
          [ -f feature.log ] || exit 0
          # One notice per shard, readable from the run page and the checks API.
          slowest=$(grep -E '^--- (PASS|FAIL)' feature.log \
            | sed -E 's/^--- [A-Z]+: ([^ ]+) \(([0-9.]+)s\)/\2s \1/' \
            | sort -rn | head -8 | paste -sd ',' - | sed 's/,/, /g')
          echo "::notice title=Slowest feature tests (${{ matrix.shard }})::${slowest}"
          failed=$(grep -E '^--- FAIL' feature.log | sed -E 's/^--- FAIL: ([^ ]+).*/\1/' | paste -sd ',' -)
          if [ -n "$failed" ]; then echo "::error title=Failed feature tests (${{ matrix.shard }})::${failed}"; fi
