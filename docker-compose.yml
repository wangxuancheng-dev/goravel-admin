# Local / demo stack: MySQL + Redis + API
# Usage:
#   cp .env.docker.example .env
#   docker compose up -d --build
#   # seed runs automatically when RUN_SEED=true (default in this compose)
#
# App:   http://localhost:3000
# Login: admin / admin123  (change after first login)
#
# Ports listen on 127.0.0.1 only (MySQL/Redis use weak demo credentials).
# To reach the app from another device on the LAN, set APP_BIND=0.0.0.0 in .env.
#
# Production blue/green: see website/docs/deploy/docker.md (docker-compose.blue.yml / green.yml)

services:
  mysql:
    # 8.4 LTS (8.0 reached end of life in April 2026).
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goravel
      MYSQL_USER: goravel
      MYSQL_PASSWORD: goravel
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - goravel_mysql_data:/var/lib/mysql
    # New accounts use caching_sha2_password (8.4 default; the Go driver supports it).
    # --mysql-native-password=ON only lets accounts created by the former mysql:8.0
    # setup (which forced mysql_native_password) keep logging in after the upgrade.
    # MySQL 9 removes that plugin: before moving to 9.x, convert such accounts with
    #   ALTER USER 'goravel'@'%' IDENTIFIED WITH caching_sha2_password BY '...';
    # and drop the flag. (--default-authentication-plugin no longer exists in 8.4.)
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - goravel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: goravel
      DB_USERNAME: goravel
      DB_PASSWORD: goravel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      # Queue workers run inside the app process, so one container is enough with redis.
      # Not sync: APP_ENV=production (the default when .env omits it) refuses non-redis queues.
      QUEUE_CONNECTION: redis
      RUN_SEED: "true"
      SKIP_MIGRATE: "false"

volumes:
  goravel_mysql_data:
  goravel_redis_data:
